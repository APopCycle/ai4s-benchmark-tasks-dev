name: validate-task-oracle-nop

on:
  pull_request:
    paths:
      - "tasks/**"
      - "task-template.toml"
      - "ci_checks/**"
      - "scripts/validate_task.sh"
  workflow_dispatch:
    inputs:
      task_path:
        description: "Repo-relative task or reference-task path"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned Harbor
        run: uv tool install --force "harbor==0.24.0"
      - name: Resolve task paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PATH: ${{ inputs.task_path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            printf '%s\n' "$INPUT_PATH" > /tmp/task-paths
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | awk -F/ '$1=="tasks" && NF>=4 {print $1"/"$2"/"$3"/"$4}' \
              | sort -u > /tmp/task-paths
          fi
          cat /tmp/task-paths
      - name: Static, oracle and nop validation
        run: |
          while IFS= read -r task; do
            [ -n "$task" ] || continue
            if [[ "$task" == reference-tasks/* ]]; then
              bash scripts/run_task_checks.sh --reference "$task"
            else
              bash scripts/run_task_checks.sh "$task"
            fi
            bash scripts/validate_task.sh "$task"
          done < /tmp/task-paths
